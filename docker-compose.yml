services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tchainapp
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: tchaindb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tchainapp -d tchaindb"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s
  app:
    build:
      context: ./back
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://tchainapp:12345@db:5432/tchaindb?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - app

volumes:
  pgdata:
